<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirection - CV Generator</title>
</head>
<body>
    <script>
        // Redirection automatique vers le tableau de bord principal
        window.location.href = 'user_home.html';
    </script>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h2>Redirection en cours...</h2>
        <p>Si vous n'êtes pas redirigé automatiquement, <a href="user_home.html">cliquez ici</a>.</p>
    </div>
</body>
</html>
                <h3 id="previewTitle">Aperçu du CV</h3>
                <button class="close-btn" onclick="closePreview()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="preview-actions">
                    <button class="btn btn-primary" onclick="downloadCurrentCV('pdf')">
                        <i class="icon">📄</i> Télécharger PDF
                    </button>
                    <button class="btn btn-secondary" onclick="downloadCurrentCV('xml')">
                        <i class="icon">📋</i> Télécharger XML
                    </button>
                    <button class="btn btn-outline" onclick="editCurrentCV()">
                        <i class="icon">✏️</i> Modifier
                    </button>
                    <button class="btn btn-danger" onclick="deleteCurrentCV()">
                        <i class="icon">🗑️</i> Supprimer
                    </button>
                </div>
                <div id="pdfPreview" class="pdf-preview">
                    <!-- PDF preview will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Import CV -->
    <div id="importModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Importer un CV</h3>
                <button class="close-btn" onclick="closeImportModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="import-section">
                    <label for="xmlFile">Sélectionner un fichier XML :</label>
                    <input type="file" id="xmlFile" accept=".xml" onchange="handleFileImport()">
                    <p class="help-text">Importez un fichier XML de CV pour le modifier ou le régénérer.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
