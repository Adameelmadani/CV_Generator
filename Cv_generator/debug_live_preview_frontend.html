<!DOCTYPE html>
<html>
<head>
    <title>Live Preview Debug Test</title>
</head>
<body>
    <h1>Live Preview Debug Test</h1>
    <button onclick="testLogin()">1. Test Login</button>
    <button onclick="testLivePreview()">2. Test Live Preview</button>
    <div id="output"></div>

    <script>
        async function testLogin() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Testing login...</p>';
            
            try {
                // Test login first
                const loginResponse = await fetch('../Login_Signup/login_handler.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: 'email=test@test.com&password=test123'
                });
                
                const loginResult = await loginResponse.text();
                output.innerHTML = `<h3>Login Response:</h3><pre>${loginResult}</pre>`;
                
            } catch (error) {
                output.innerHTML = `<h3>Login Error:</h3><pre>${error.message}</pre>`;
            }
        }
        
        async function testLivePreview() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>Testing live preview...</p>';
            
            try {
                const testData = {
                    nom: 'Test',
                    prenom: 'User',
                    email: 'test@example.com',
                    telephone: '123-456-7890',
                    location: 'Test City',
                    profil_description: 'Test profile description'
                };
                
                console.log('🔥 Sending test data:', testData);
                
                const response = await fetch('generate_live_preview_mvc.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });
                
                console.log('🔥 Response status:', response.status);
                console.log('🔥 Response headers:', response.headers);
                
                const responseText = await response.text();
                console.log('🔥 Raw response:', responseText);
                
                output.innerHTML = `
                    <h3>Live Preview Response:</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Headers:</strong> ${JSON.stringify([...response.headers.entries()])}</p>
                    <h4>Raw Response:</h4>
                    <pre style="max-height: 400px; overflow: auto; background: #f5f5f5; padding: 10px;">${responseText}</pre>
                `;
                
                // Try to parse as JSON
                try {
                    const jsonResult = JSON.parse(responseText);
                    output.innerHTML += `<h4>Parsed JSON:</h4><pre>${JSON.stringify(jsonResult, null, 2)}</pre>`;
                } catch (parseError) {
                    output.innerHTML += `<h4>JSON Parse Error:</h4><pre>${parseError.message}</pre>`;
                }
                
            } catch (error) {
                console.error('Network error:', error);
                output.innerHTML = `<h3>Network Error:</h3><pre>${error.message}</pre>`;
            }
        }
    </script>
</body>
</html>
